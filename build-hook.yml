name: build-hook

# 构建 LSPosed 模块（拍照签到图片注入）
# 用法：推到 GitHub -> Actions 跑完 -> Artifacts 下 app-debug.apk

on:
  push:
    paths:
      - 'android-hook/**'
      - '.github/workflows/build-hook.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译模块 APK
        working-directory: android-hook
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cxsign-hook-apk
          path: android-hook/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
